                        </div>

                        <div class="space-y-3">
                            <h4 class="font-bold text-slate-800 text-base">B. Indonesia, Zamrud di Khatulistiwa</h4>
                            <p>Indonesia terletak di sekitar garis khatulistiwa (0 derajat). Kota Pontianak adalah salah satu wilayah yang dilalui garis ini. Posisi ini memberikan iklim tropis dengan dua musim (hujan dan kemarau) serta kekayaan alam hutan hujan yang hijau subur bagaikan permata zamrud.</p>
                            <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 text-xs sm:text-sm">
                                <b>Fakta Penting:</b> Iklim tropis dan tanah vulkanik yang subur menjadikan keanekaragaman flora dan fauna di Indonesia sangat melimpah.
                            </div>
                        </div>

                        <div class="space-y-3">
                            <h4 class="font-bold text-slate-800 text-base">C. Kehidupan sebagai Negara Maritim dan Agraris</h4>
                            <p><b>Negara Maritim:</b> Negara yang memiliki wilayah laut yang sangat luas dan kaya akan sumber daya kelautan. <b>Negara Agraris:</b> Negara yang penduduknya banyak bermata pencaharian sebagai petani karena didukung tanah yang subur.</p>
                            <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-200 text-xs sm:text-sm">
                                <b>Rangkuman:</b> Letak geografis Indonesia sangat strategis dan memengaruhi corak pekerjaan masyarakatnya menjadi nelayan, petani, peternak, dan pelaut.
                            </div>
                        </div>
                    </div>
                `;
            } else if (bab === 'bab2') {
                return `
                    <div class="space-y-4">
                        <div class="bg-blue-50 p-4 rounded-2xl border border-blue-200">
                            <h3 class="font-extrabold text-blue-800 text-lg mb-2">BAB 2 – MAJULAH DAERAHKU!</h3>
                            <p class="text-slate-600">Mempelajari kebutuhan manusia, kegiatan ekonomi (produksi, distribusi, konsumsi), serta cara menjadi pelaku ekonomi yang bijak.</p>
                        </div>

                        <div class="space-y-3">
                            <h4 class="font-bold text-slate-800 text-base">A. Bagaimana Aku Memenuhi Kebutuhanku?</h4>
                            <p>Kebutuhan adalah segala sesuatu yang diperlukan manusia untuk kelangsungan hidup. Kebutuhan pokok (primer) meliputi makanan, pakaian, dan rumah. Alat pemenuh kebutuhan dibedakan menjadi <b>barang</b> (berwujud fisik seperti buku dan baju) dan <b>jasa</b> (pelayanan tenaga seperti guru dan dokter).</p>
                        </div>

                        <div class="space-y-3">
                            <h4 class="font-bold text-slate-800 text-base">B. Kegiatan Ekonomi di Daerahku</h4>
                            <p>Kegiatan ekonomi terbagi tiga:</p>
                            <ul class="list-disc pl-5 space-y-1">
                                <li><b>Produksi:</b> Kegiatan menghasilkan barang/jasa (contoh: petani menanam padi, nelayan mencari ikan).</li>
                                <li><b>Distribusi:</b> Kegiatan menyalurkan barang dari produsen ke konsumen (contoh: sopir truk mengantar sayur ke pasar).</li>
                                <li><b>Konsumsi:</b> Kegiatan menghabiskan nilai guna barang/jasa (contoh: makan nasi atau memakai sepatu).</li>
                            </ul>
                        </div>

                        <div class="space-y-3">
                            <h4 class="font-bold text-slate-800 text-base">C. Aku Pelaku Ekonomi yang Bijak</h4>
                            <p>Pelaku ekonomi yang bijak mampu membedakan antara <b>kebutuhan</b> (hal wajib untuk hidup) dan <b>keinginan</b> (tambahan kesenangan yang bisa ditunda). Kita harus menggunakan uang dengan bijak, gemar menabung, tidak boros, serta menjaga lingkungan dalam setiap kegiatan ekonomi.</p>
                        </div>
                    </div>
                `;
            } else if (bab === 'bab3') {
                return `
                    <div class="space-y-4">
                        <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200">
                            <h3 class="font-extrabold text-amber-800 text-lg mb-2">BAB 3 – HARMONI DALAM EKOSISTEM</h3>
                            <p class="text-slate-600">Mengenal ekosistem, komponen biotik & abiotik, rantai makanan, jaring-jaring makanan, serta peran manusia.</p>
                        </div>

                        <div class="space-y-3">
                            <h4 class="font-bold text-slate-800 text-base">A. Berkenalan dengan Ekosistem</h4>
                            <p>Ekosistem adalah hubungan timbal balik antara makhluk hidup dengan lingkungan sekitarnya. Terdiri dari dua komponen:</p>
                            <ul class="list-disc pl-5 space-y-1">
                                <li><b>Biotik:</b> Komponen makhluk hidup (manusia, hewan, tumbuhan, bakteri).</li>
                                <li><b>Abiotik:</b> Komponen benda tak hidup (air, tanah, udara, cahaya matahari, suhu).</li>
                            </ul>
                        </div>

                        <div class="space-y-3">
                            <h4 class="font-bold text-slate-800 text-base">B. Interaksi Antarkomponen dalam Ekosistem</h4>
                            <p>Makhluk hidup saling berinteraksi melalui peristiwa makan dan dimakan:</p>
                            <ul class="list-disc pl-5 space-y-1">
                                <li><b>Produsen:</b> Tumbuhan hijau yang membuat makanan sendiri (fotosintesis).</li>
                                <li><b>Konsumen:</b> Hewan pemakan tumbuhan atau hewan lain.</li>
                                <li><b>Pengurai (Dekomposer):</b> Jamur dan bakteri yang menguraikan sisa makhluk mati menjadi zat hara.</li>
                                <li><b>Rantai & Jaring-jaring Makanan:</b> Urutan makan dan dimakan yang saling terhubung.</li>
                            </ul>
                        </div>

                        <div class="space-y-3">
                            <h4 class="font-bold text-slate-800 text-base">C. Peran Manusia dalam Ekosistem</h4>
                            <p>Manusia berperan penting menjaga keseimbangan alam. Tindakan positif meliputi reboisasi (menanam pohon), menjaga kebersihan lingkungan, dan melindungi hewan langka. Tindakan negatif yang merusak adalah penebangan liar dan pembuangan sampah sembarangan.</p>
                        </div>
                    </div>
                `;
            } else if (bab === 'bab4') {
                return `
                    <div class="space-y-4">
                        <div class="bg-cyan-50 p-4 rounded-2xl border border-cyan-200">
                            <h3 class="font-extrabold text-cyan-800 text-lg mb-2">BAB 4 – AIR SUMBER KEHIDUPAN</h3>
                            <p class="text-slate-600">Mempelajari aliran air, siklus air, serta pentingnya menjaga ketersediaan air bersih di lingkungan.</p>
                        </div>

                        <div class="space-y-3">
                            <h4 class="font-bold text-slate-800 text-base">A. Ke Mana Air Mengalir?</h4>
                            <p>Air mengalir dari tempat tinggi ke tempat rendah melalui sungai, danau, hingga bermuara di laut. Air sangat penting bagi seluruh makhluk hidup untuk minum, memasak, dan membersihkan diri.</p>
                        </div>

                        <div class="space-y-3">
                            <h4 class="font-bold text-slate-800 text-base">B. Beginilah Terjadinya Siklus Air</h4>
                            <p>Siklus air (hidrologi) terjadi secara berputar:</p>
                            <ul class="list-disc pl-5 space-y-1">
                                <li><b>Evaporasi:</b> Penguapan air oleh panas matahari.</li>
                                <li><b>Kondensasi:</b> Pendinginan uap air membentuk awan.</li>
                                <li><b>Presipitasi:</b> Turunya titik air menjadi hujan.</li>
                                <li><b>Infiltrasi:</b> Air meresap ke dalam tanah menjadi cadangan air bersih.</li>
                            </ul>
                        </div>

                        <div class="space-y-3">
                            <h4 class="font-bold text-slate-800 text-base">C. Ke Mana Air Bersih di Lingkunganku?</h4>
                            <p>Air bersih bersumber dari sumur dan mata air terlindungi. Kita wajib menjaga kelestarian air dengan cara menghemat penggunaan air, tidak membuang sampah ke sungai, serta menanam pohon di sekitar lingkungan.</p>
                        </div>
                    </div>
                `;
            }
        }

        // 4. Quiz Screen
        function renderQuizScreen() {
            const qIndex = gameState.currentQuestionIndex;
            const currentQ = questionsData[qIndex];
            const totalQ = questionsData.length;
            const savedAns = gameState.quizAnswers[qIndex];

            return `
                <div class="bg-white rounded-3xl card-shadow p-6 sm:p-8 border-4 border-indigo-400">
                    <!-- Top Bar: Progress, Name, Score -->
                    <div class="flex flex-col sm:flex-row justify-between items-center mb-6 pb-4 border-b border-slate-200 gap-3">
                        <div>
                            <span class="bg-indigo-100 text-indigo-800 font-bold px-3 py-1 rounded-full text-xs">
                                SOAL ${qIndex + 1} DARI ${totalQ} (Bab ${currentQ.bab})
                            </span>
                        </div>
                        <div class="flex items-center gap-4 text-sm font-bold text-slate-700">
                            <span>👤 Nama: ${gameState.studentName}</span>
                            <span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">⭐ Skor: ${gameState.score}</span>
                        </div>
                    </div>

                    <!-- Question Text -->
                    <div class="mb-6">
                        <h3 class="text-lg sm:text-xl font-bold text-slate-800 leading-snug">
                            ${currentQ.question}
                        </h3>
                    </div>

                    <!-- Options Grid -->
                    <div class="space-y-3 mb-6">
                        ${currentQ.options.map(opt => {
                            let btnStyle = "bg-slate-50 hover:bg-indigo-50 border-slate-200 text-slate-700";
                            if (savedAns && savedAns.selected === opt.key) {
                                btnStyle = "bg-indigo-600 text-white border-indigo-600 shadow-md";
                            }
                            return `
                                <button onclick="selectAnswer('${opt.key}')" 
                                    class="w-full text-left p-4 rounded-2xl border-2 font-medium transition flex items-center gap-4 ${btnStyle}">
                                    <span class="w-8 h-8 rounded-xl bg-white text-indigo-600 font-bold flex items-center justify-center shadow-sm flex-shrink-0">
                                        ${opt.key}
                                    </span>
                                    <span class="text-sm sm:text-base">${opt.text}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-slate-200">
                        <button onclick="goToMaterialFromQuiz()" class="w-full sm:w-auto px-5 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow text-sm transition flex items-center justify-center gap-2">
                            📚 KEMBALI KE MATERI
                        </button>

                        <button onclick="submitAnswer()" ${!savedAns ? 'disabled opacity-50 cursor-not-allowed' : ''} 
                            class="w-full sm:w-auto px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow text-base transition">
                            ${qIndex === totalQ - 1 ? '🏁 SELESAI & LIHAT HASIL' : '➡ JAWAB & LANJUT'}
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(key) {
            const qIndex = gameState.currentQuestionIndex;
            gameState.quizAnswers[qIndex] = { selected: key };
            renderApp();
        }

        function goToMaterialFromQuiz() {
            gameState.step = 'material';
            renderApp();
        }

        function submitAnswer() {
            const qIndex = gameState.currentQuestionIndex;
            const currentQ = questionsData[qIndex];
            const ans = gameState.quizAnswers[qIndex];

            if (!ans) return;

            const isCorrect = (ans.selected === currentQ.correct);
            gameState.quizAnswers[qIndex].isCorrect = isCorrect;

            if (isCorrect) {
                gameState.score += 20;
                gameState.correctCount++;
                speakText(`Benar, ${gameState.studentName}! Hebat sekali!`);
            } else {
                gameState.incorrectCount++;
                speakText(`Belum tepat, ${gameState.studentName}. Yuk, pelajari kembali materinya.`);
            }

            gameState.step = 'feedback';
            renderApp();
        }

        // 5. Feedback Screen (Benar / Salah + Pembahasan)
        function renderFeedbackScreen() {
            const qIndex = gameState.currentQuestionIndex;
            const currentQ = questionsData[qIndex];
            const ans = gameState.quizAnswers[qIndex];
            const isCorrect = ans.isCorrect;

            return `
                <div class="bg-white rounded-3xl card-shadow p-6 sm:p-10 border-4 ${isCorrect ? 'border-emerald-400' : 'border-rose-400'} max-w-2xl mx-auto text-center">
                    <div class="mb-4">
                        <span class="text-5xl">${isCorrect ? '✅' : '❌'}</span>
                    </div>

                    <h2 class="text-2xl sm:text-3xl font-extrabold mb-1 ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}">
                        ${isCorrect ? '✓ BENAR!' : '✗ BELUM TEPAT'}
                    </h2>
                    <p class="text-slate-600 text-sm mb-6 font-medium">
                        ${isCorrect ? `Hebat, ${gameState.studentName}!` : `${gameState.studentName}, jangan menyerah!`}
                    </p>

                    <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 text-left mb-6 space-y-3">
                        ${!isCorrect ? `
                            <div class="text-sm font-bold text-rose-600">
                                Jawaban yang benar adalah: Pilihan ${currentQ.correct}
                            </div>
                        ` : ''}
                        <div>
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Pembahasan:</span>
                            <p class="text-slate-700 text-sm sm:text-base leading-relaxed">${currentQ.explanation}</p>
                        </div>
                    </div>

                    <button onclick="nextQuestion()" class="w-full sm:w-auto px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg transition text-base pulse-btn">
                        ➡ LANJUT KE SOAL BERIKUTNYA
                    </button>
                </div>
            `;
        }

        function nextQuestion() {
            gameState.currentQuestionIndex++;
            if (gameState.currentQuestionIndex >= questionsData.length) {
                gameState.step = 'result';
                speakText(`Selamat, ${gameState.studentName}! Kamu telah menyelesaikan 50 soal IPAS.`);
            } else {
                gameState.step = 'quiz';
                speakText(`Bagus, ${gameState.studentName}. Sekarang kita lanjut ke soal berikutnya.`);
            }
            renderApp();
        }

        // 6. Result Screen
        function renderResultScreen() {
            return `
                <div class="bg-white rounded-3xl card-shadow p-6 sm:p-10 border-4 border-emerald-400 max-w-2xl mx-auto text-center">
                    <div class="text-5xl mb-3">🎉</div>
                    <h2 class="text-3xl font-extrabold text-emerald-600 mb-1">KUIS SELESAI!</h2>
                    <p class="text-slate-600 text-sm mb-6">Selamat, <b>${gameState.studentName}</b>!</p>

                    <!-- Score Card -->
                    <div class="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-6 mb-6">
                        <div class="text-xs font-bold text-emerald-800 uppercase tracking-wider mb-1">Total Skor Kamu</div>
                        <div class="text-4xl sm:text-5xl font-extrabold text-emerald-700 mb-2">${gameState.score} <span class="text-xl text-slate-400">/ 1000</span></div>
                        <div class="flex justify-center gap-6 text-sm font-semibold text-slate-600 mt-4 pt-4 border-t border-emerald-200/60">
                            <span class="text-emerald-600">✅ Benar: ${gameState.correctCount}</span>
                            <span class="text-rose-600">❌ Salah: ${gameState.incorrectCount}</span>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-center gap-4">
                        <button onclick="viewCertificate()" class="px-6 py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-2xl shadow transition text-base flex items-center justify-center gap-2">
                            🏆 LIHAT SERTIFIKAT
                        </button>
                        <button onclick="restartQuiz()" class="px-6 py-3.5 bg-slate-700 hover:bg-slate-800 text-white font-bold rounded-2xl shadow transition text-base flex items-center justify-center gap-2">
                            🔄 ULANGI KUIS
                        </button>
                    </div>
                </div>
            `;
        }

        function viewCertificate() {
            gameState.step = 'certificate';
            renderApp();
        }

        function restartQuiz() {
            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.incorrectCount = 0;
            gameState.selectedAnswer = null;
            gameState.quizAnswers = {};
            gameState.step = 'quiz';
            renderApp();
        }

        // 7. Certificate Screen
        function renderCertificateScreen() {
            const currentDate = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            return `
                <div class="bg-white rounded-3xl card-shadow p-6 sm:p-10 border-8 border-amber-300 max-w-2xl mx-auto text-center relative overflow-hidden">
                    <div class="absolute top-2 left-2 text-amber-300 text-2xl">★</div>
                    <div class="absolute top-2 right-2 text-amber-300 text-2xl">★</div>
                    <div class="absolute bottom-2 left-2 text-amber-300 text-2xl">★</div>
                    <div class="absolute bottom-2 right-2 text-amber-300 text-2xl">★</div>

                    <div class="text-xs font-bold uppercase tracking-widest text-amber-600 mb-1">SERTIFIKAT PENGHARGAAN</div>
                    <h2 class="text-2xl sm:text-4xl font-extrabold text-slate-800 mb-2">PETUALANGAN IPAS KELAS 5</h2>
                    <p class="text-xs text-slate-500 mb-6">Diberikan dengan bangga kepada:</p>

                    <div class="text-2xl sm:text-3xl font-bold text-emerald-600 border-b-2 border-emerald-300 pb-2 mb-4 inline-block px-6">
                        ${gameState.studentName}
                    </div>

                    <p class="text-slate-600 text-sm max-w-md mx-auto mb-6 leading-relaxed">
                        Atas keberhasilannya menyelesaikan 50 soal uji kompetensi IPAS Kelas 5 SD/MI dengan sangat baik.
                    </p>

                    <!-- Stats on Cert -->
                    <div class="flex justify-center gap-6 bg-amber-50/60 p-4 rounded-2xl border border-amber-200 mb-6 max-w-sm mx-auto text-sm font-bold text-slate-700">
                        <div>Skor: <span class="text-emerald-600">${gameState.score} / 1000</span></div>
                        <div>Benar: <span class="text-emerald-600">${gameState.correctCount} / 50</span></div>
                    </div>

                    <div class="text-xs text-slate-500 mb-8">
                        Tanggal: <b>${currentDate}</b>
                    </div>

                    <!-- Developer signature badge -->
                    <div class="border-t border-slate-200 pt-4 flex justify-between items-center text-xs text-slate-500">
                        <div>Pengembang: <b>Giga Inovation</b></div>
                        <div>Kontak: <b>081329200985</b></div>
                    </div>

                    <div class="mt-6 flex flex-col sm:flex-row justify-center gap-4">
                        <button onclick="window.print()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow text-sm transition">
                            🖨️ CETAK / SIMPAN SERTIFIKAT
                        </button>
                        <button onclick="restartQuiz()" class="px-6 py-3 bg-slate-700 hover:bg-slate-800 text-white font-bold rounded-xl shadow text-sm transition">
                            🔄 ULANGI KUIS
                        </button>
                    </div>
                </div>
            `;
        }

        // Initialize on load
        window.onload = function () {
            renderApp();
        };
    </script>
</body>
</html>
